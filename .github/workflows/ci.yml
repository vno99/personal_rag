name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Install the project's non-torch deps from a dedicated file, then
          # overlay the CPU torch build. requirements-ci.txt is the source of
          # truth for non-torch deps: do not re-list versions here, otherwise
          # a future addition to requirements.txt is silently missed by CI.
          pip install -r requirements-ci.txt
          pip install torch==2.6.0+cpu torchvision==0.21.0+cpu torchaudio==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Check Python syntax
        run: |
          find . -name "*.py" -type f ! -path "./data/*" -exec python -m py_compile {} + || exit 1
