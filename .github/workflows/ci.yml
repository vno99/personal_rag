name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Override torch with CPU version for CI
          pip install torch==2.6.0+cpu torchvision==0.21.0+cpu torchaudio==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          # Install core dependencies (without torch packages from requirements.txt)
          pip install langchain-community==0.4.1 lxml==6.1.0 beautifulsoup4==4.14.3 tqdm==4.67.3
          pip install transformers==5.6.2 weaviate-client==4.21.0 langchain_huggingface==1.2.2 sentence-transformers==5.4.1

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Check Python syntax
        run: |
          find . -name "*.py" -type f ! -path "./data/*" -exec python -m py_compile {} + || exit 1
